<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="#">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css">
    <meta name="description" content="欢迎来到晨殇的奇妙世界！">
    <meta name="keywords" content="Chenn,chenn,个人主页,个人网站">
    <title></title>

    <style>
      /* 强制固定在右下角 */
      #waifu {
        position: fixed !important;
        right: 0 !important;
        left: auto !important;
        bottom: 0 !important;
        z-index: 99999 !important;
      }
    
      /* 拖动时鼠标变成移动图标 */
      #waifu-tips {
        cursor: move !important;
      }
    </style>
    
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
        <!-- Live2D 核心库 -->
        <script src="https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0/dist/autoload.js"></script>

        <script>
           initWidget({
            waifuPath: "https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0/dist/waifu-tips.json",
            cdnPath: "https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/",
            modelId: 0,
            drag: true,
            tools: ["switch-model", "switch-texture", "about", "quit"],
            logLevel: "info"
          });
        </script>
        
  </body>
</html>
